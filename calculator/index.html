
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Calculator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2f7;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.calculator {
    background: #172554;
    padding: 25px;
    border-radius: 20px;
    width: 320px;
    box-shadow: 0 10px 25px #0003;
}

h2 {
    color: white;
    text-align: center;
}

#display {
    width: 100%;
    height: 75px;
    margin-bottom: 15px;
    font-size: 30px;
    text-align: right;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: white;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

button {
    height: 58px;
    border: none;
    border-radius: 10px;
    font-size: 21px;
    cursor: pointer;
    background: #dbeafe;
}

button:active {
    opacity: 0.7;
}

.operator {
    background: #60a5fa;
}

.clear {
    background: #f87171;
    color: white;
}

.equal {
    background: #22c55e;
    color: white;
}

</style>
</head>

<body>

<div class="calculator">

<h2>Calculator</h2>

<input type="text" id="display"
value="0" readonly>

<div class="buttons">

<button class="clear" data-action="clear">C</button>
<button data-action="delete">DEL</button>
<button class="operator" data-action="operator" data-value="%">%</button>
<button class="operator" data-action="operator" data-value="/">÷</button>

<button data-number="7">7</button>
<button data-number="8">8</button>
<button data-number="9">9</button>
<button class="operator" data-action="operator" data-value="*">×</button>

<button data-number="4">4</button>
<button data-number="5">5</button>
<button data-number="6">6</button>
<button class="operator" data-action="operator" data-value="-">−</button>

<button data-number="1">1</button>
<button data-number="2">2</button>
<button data-number="3">3</button>
<button class="operator" data-action="operator" data-value="+">+</button>

<button data-action="sign">+/-</button>
<button data-number="0">0</button>
<button data-action="decimal">.</button>
<button class="equal" data-action="equal">=</button>

</div>
</div>

<script>
const display = document.getElementById("display");

let current = "0";
let previous = null;
let operator = null;
let reset = false;

function update() {
    display.value = current;
}

function calculate() {
    const a = Number(previous);
    const b = Number(current);
    let result;

    if (operator === "+") result = a + b;
    if (operator === "-") result = a - b;
    if (operator === "*") result = a * b;
    if (operator === "/") {
        if (b === 0) {
            current = "Error";
            previous = null;
            operator = null;
            reset = true;
            update();
            return;
        }
        result = a / b;
    }
    if (operator === "%") result = a % b;

    current = String(Number(result.toFixed(8)));
    previous = null;
    operator = null;
    reset = true;
    update();
}

document.querySelector(".buttons").addEventListener("click", function(e) {
    const btn = e.target;
    if (btn.tagName !== "BUTTON") return;

    const action = btn.dataset.action;

    if (btn.dataset.number !== undefined) {
        if (reset || current === "Error") {
            current = btn.dataset.number;
            reset = false;
        } else {
            current = current === "0"
                ? btn.dataset.number
                : current + btn.dataset.number;
        }
    }

    else if (action === "clear") {
        current = "0";
        previous = null;
        operator = null;
        reset = false;
    }

    else if (action === "delete") {
        current = current.length > 1
            ? current.slice(0, -1) : "0";
    }

    else if (action === "decimal") {
        if (reset || current === "Error") {
            current = "0.";
            reset = false;
        } else if (!current.includes(".")) {
            current += ".";
        }
    }

    else if (action === "sign") {
        if (current !== "0" && current !== "Error") {
            current = String(-Number(current));
        }
    }

    else if (action === "operator") {
        if (current === "Error") return;

        if (operator && !reset) {
            calculate();
        }

        previous = current;
        operator = btn.dataset.value;
        reset = true;
    }

    else if (action === "equal") {
        if (operator && previous !== null) {
            calculate();
        }
    }

    update();
});

</script>

</body>
</html>
