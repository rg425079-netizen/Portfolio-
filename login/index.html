
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 380px;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h2 {
      text-align: center;
      margin-bottom: 10px;
      color: #333;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      color: #333;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    input:focus {
      border-color: #667eea;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 18px 0;
      font-size: 13px;
    }

    .options label {
      display: inline;
      margin: 0;
    }

    a {
      color: #667eea;
      text-decoration: none;
    }

    button {
      width: 100%;
      padding: 13px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #5366c9;
    }

    .signup {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Welcome Back!</h2>
    <p class="subtitle">Please login to your account</p>

    <form onsubmit="loginDemo(event)">
      <label>Email Address</label>
      <input type="email" placeholder="Enter your email" required>

      <label>Password</label>
      <input type="password" id="password"
             placeholder="Enter your password" required>

      <div class="options">
        <label>
          <input type="checkbox"> Remember me
        </label>
        <a href="#" onclick="alert('Demo page: password reset is not connected.'); return false;">Forgot Password?</a>
      </div>

      <button type="submit">Login</button>
    </form>

    <p class="signup">
      Don't have an account? <a href="#" onclick="alert('Sign up is not connected yet.'); return false;">Sign Up</a>
    </p>
  </div>

  <script>
    function loginDemo(event) {
      event.preventDefault();
      alert("Login page demo successful! No account was created.");
    }
  </script>

</body>
</html>
